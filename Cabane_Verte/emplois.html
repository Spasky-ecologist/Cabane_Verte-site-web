<!DOCTYPE html>
<html>
<head>
    <title>La Cabane Verte - Emplois</title>
    <meta name="Author" content="Patrice Léveillé" />
    <meta name="Description" content="Restaurant La Cabane Verte">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="/Content/bootstrap.css" rel="stylesheet">
    <link href="/Content/fontawesome-all.css" rel="stylesheet">
    <link href="Content/Styles.css" rel="stylesheet">

    <style>
        /*div[class*="col-"],*/ section, aside, header, article, nav {
            border: 1px solid black;
            /*height: 80px;*/
            text-align: center;
        }

        section, aside {
            height: 1250px;
        }

        nav, header {
            height: 80px;
        }

        .container {
            background-color: #ffffff;
        }
    </style>

</head>

<body>
    <div class="container">

        <div class="row">
            <nav></nav>
        </div>

        <div class="row">
            <section class="col-md-9">
                <br>
                <h2>Postes disponibles</h2> <br>
                <p style="text-align:left">
                    <b>Nous sommes actuellement à la recherche de personnes motivées pour combler notre équipe!</b> <br>
                    • Cuisiners (4) <br>
                    • Serveurs (5) <br>
                    • Plongeurs (4) <br>
                    • Concierge (2) <br>
                    • Livreurs (3)
                </p> <br>

                     <form id="emploi_app" action="mailto:cabaneverte@restaurant.com" method="post">
                         <select id="emplois" name="emplois" class="form-control" required>
                             <option disabled selected style="display:none">Choisissez un poste</option>
                             <option>Cuisinier</option>
                             <option>Serveur</option>
                             <option>Plongeur</option>
                             <option>Concierge</option>
                             <option>Livreur</option>
                         </select> <br>


                         <div class="form-group row">
                             <label class="col-sm-2 col-form-label" for="nom">*Nom:</label>
                             <div class="col-sm-6">
                                 <input type="text" class="form-control" name="nom" id="nom" required placeholder="Entrez votre nom complet">
                             </div>
                         </div>

                         <div class="form-group row">
                             <label class="col-sm-2 col-form-label" for="age">*Âge:</label>
                             <div class="col-sm-6">
                                 <input type="text" class="form-control" name="age" id="age" required placeholder="Entrez votre âge">
                             </div>
                         </div>

                         <div class="form-group row">
                             <label class="col-sm-2 col-form-label" for="courriel">*Adresse courriel:</label>
                             <div class="col-sm-6">
                                 <input type="text" class="form-control" name="courriel" id="courriel" required placeholder="Entrez votre adresse courriel">
                             </div>
                         </div>

                         <div class="row form-group">
                             <label class="col-sm-2 col-form-label">*Sexe:</label>
                             <div class="col-sm-1">
                                 <div class="form-check">
                                     <input id="Homme" name="Sexe" class="form-check-input" type="radio" required /> Homme
                                 </div>
                                 <div class="form-check">
                                     <input id="Femme" name="Sexe" class="form-check-input" type="radio" required /> Femme
                                 </div>
                             </div>
                         </div>

                         <div class="form-group row">
                             <label class="col-sm-2 col-form-label">Secondaire:</label>
                             <div class="col-sm-1">
                                 <input id="Checkbox1" name="Checkbox1" type="checkbox" class="form-check-input">
                             </div>
                             <div class="col-sm-8">
                                 <input id="année" type="text" class="form-control" name="année" required placeholder="Entrez l'année du secondaire dernièrement réussie">
                             </div>
                         </div>

                         <div class="form-group row">
                             <label class="col-sm-2 col-form-label">Cégep:</label>
                             <div class="col-sm-1">
                                 <input id="Checkbox2" name="Checkbox2" type="checkbox" class="form-check-input">
                             </div>
                             <div class="col-sm-8">
                                 <input id="année2" type="text" class="form-control" name="année2" placeholder="Entrez le nombre de sessions réussies ainsi que le programme">
                             </div>
                         </div>

                         <div class="form-group row">
                             <label class="col-sm-2 col-form-label">Université:</label>
                             <div class="col-sm-1">
                                 <input id="Checkbox3" name="Checkbox3" type="checkbox" class="form-check-input">
                             </div>
                             <div class="col-sm-8">
                                 <input id="année3" type="text" class="form-control" name="année3" placeholder="Entrez le nombre de sessions réussies ainsi que le programme">
                             </div>
                         </div>

                         <p style="text-align:left">
                             Joignez votre fichier contenant votre CV ici :
                         </p>
                         <input id="cv" name="cv" type="file" class="form-control-file" style="width:500px" required> <br>

                         <div class="row form-group">
                             <div class="col-sm-7"></div>
                             <div class="col-sm-5">
                                 <button id="reset" name="reset" type="reset" class="btn btn-primary">Reset</button>
                                 <button id="soumettre" name="soumettre" type="submit" class="btn btn-primary">Soumettre</button>
                             </div>
                         </div>
                     </form>

            </section>

            <aside></aside>
        </div>


    </div>

    <script src="/Scripts/jquery-3.3.1.js"></script>
    <script src="/Scripts/bootstrap.bundle.js"></script>
    <script src="/Scripts/jquery.validate.js"></script>

    <script>
        $.get('_menu.html', function (data) {
            $('nav').replaceWith(data);
            $("#choix5").addClass("active");
        });
        $.get('publicité.html', function (data) {
            $('aside').replaceWith(data);
        });
        var validation = $("#emploi_app").validate({
            rules: {
                nom: {
                    required: true
                },
                age: {
                    required: true,
                    minlength: 2
                },
                courriel: {
                    required: true,
                    email: true
                },
                Checkbox1: {
                    required: true
                },
                année: {
                    required: true
                }
            },
            messages: {
                nom: {
                    required: "Ce champ est requis."
                },
                age: {
                    required: "Ce champ est requis.",
                    minlength: "Votre âge doit avoir au moins 2 chiffres."
                },
                courriel: {
                    email: "Veuillez entrer une adresse courriel valide.",
                    required: "Ce champ est requis."
                },
                emplois: {
                    required: "Ce champ est requis."
                },
                Sexe: {
                    required: "Ce champ est requis."
                },
                Checkbox1: {
                    required: "Ce champ est requis."
                },
                année: {
                    required: "Ce champ est requis."
                },
                cv: {
                    required: "Ce champ est requis."
                }
            }
        });
        // Pour vider le formulaire correctement
        $("button[type='reset']").click(function () {
            validation.resetForm();
        });

    </script>
</body>

</html>
